# src/ex6.pyが直接読み込む設定。相対パスはこのファイルを基準に解決する。
input_dir: ../data/self_videos
video_pattern: "歩行動画*.mp4"
model_path: ../data/models/pose_landmarker_lite.task
estimator: mediapipe
mmpose_pose3d_model: human3d
mmpose_pose3d_weights: null
mmpose_detector: null
mmpose_device: cpu
mmpose_max_input_size: 1024
output_dir: ../out/ex6
frame_stride: 3
max_frames: null
gif_fps: 10
panel_size: 512
min_detection_confidence: 0.5
min_presence_confidence: 0.5
min_tracking_confidence: 0.5
display_visibility_threshold: 0.5
rotate_pose_90_degrees: false
first_dimension: [4, 5, 6]
second_dimension: [4, 5, 6]
geodestic_dimension: [4, 5, 6]
frame_interval: [2, 3]
contribution_threshold: 0.999
