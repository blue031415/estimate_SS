[project]
name = "estimate-ss"
version = "0.1.0"
description = "Shape Subspaceを用いたモーション解析実験"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ezc3d>=1.7.0",
    "matplotlib>=3.10.9",
    "mediapipe>=1.0.0",
    "numpy>=2.4.6",
    "opencv-contrib-python>=5.0.0.93",
    "pyyaml>=6.0.2",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
mmpose = [
    "mmcv-lite>=2.0.1,<2.2.0",
    "mmdet>=3.3.0",
    "mmengine>=0.10.7",
    "mmpose>=1.3.2",
    "setuptools<81",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
xtcocotools = ["numpy", "cython"]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | build
  | dist
  | __pycache__
  | migrations
)/
'''
